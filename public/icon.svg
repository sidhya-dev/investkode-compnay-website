<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Orange Gradient for the Arrow & Ascending Bars -->
    <linearGradient id="brandOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Deep Charcoal / Slate Gradient for the Left Pillar -->
    <linearGradient id="brandDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Left Vertical Pillar / Building -->
  <path
    d="M 152 400 L 152 144 L 204 124 L 204 290 L 178 316 L 178 400 Z"
