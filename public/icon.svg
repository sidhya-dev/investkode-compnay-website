  />

  <!-- Main Diagonal Rising Arrow Body -->
  <path
    d="M 190 400 L 372 160 L 350 144 L 400 132 L 392 188 L 372 160 L 218 400 Z"
    fill="url(#brandOrangeGrad)"
  />

  <!-- Lower Right Leg of 'K' -->
